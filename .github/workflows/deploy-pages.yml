name: Deploy Mesh2Motion fork
on: {push: {branches: [main]}, workflow_dispatch: {}}
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - {uses: actions/checkout@v4, with: {repository: Digi-dm/mesh2motion-app, ref: main}}
      - {uses: actions/setup-node@v4, with: {node-version: '24'}}
      - {run: npm ci}
      - {run: npm run build}
      # Encrypted Quest Book, served at /quest-book/
      - {uses: actions/checkout@v4, with: {path: site-extras, sparse-checkout: quest-book}}
      - {run: cp -r site-extras/quest-book dist/quest-book}
      - {uses: actions/upload-pages-artifact@v3, with: {path: dist}}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - {uses: actions/deploy-pages@v4}
